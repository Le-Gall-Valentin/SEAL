name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Une nouvelle poussée annule l'analyse en cours d'une pull request, jamais celle d'un commit de main (ADR 0014).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Serveur (./mvnw verify)
    timeout-minutes: 30
    # Runner épinglé : l'image change quand une pull request le décide, pas au gré de GitHub.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: ./.github/actions/docker-hub-mirror

      # Tests unitaires et d'intégration (Testcontainers), Spotless, SpotBugs, JaCoCo, ArchUnit.
      - run: ./mvnw -B verify

  protocol:
    name: Protocole (vecteurs à jour)
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: src/protocol
    steps:
      - uses: actions/checkout@v7

      # MSG-02, ADR 0006 : les vecteurs relus par Java et TypeScript sont exactement ceux que produit
      # le générateur Python indépendant.
      - run: python3 tools/gen_vectors.py --check

  client:
    name: Client (lint, tests, audit)
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - run: npm ci

      # Typage (tsc -b), ESLint et Prettier.
      - run: npm run lint

      # Vitest avec les seuils de couverture de QA-10.
      - run: npm test

      # QA-08.
      - run: npm audit --audit-level=high

  dependency-check:
    name: OWASP Dependency-Check (serveur)
    timeout-minutes: 45
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: src/server
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Base de vulnérabilités en cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ github.run_id }}
          restore-keys: dependency-check-

      # QA-08 : échec à partir d'un score CVSS de 7. Sans clé NVD, la base se télécharge en plusieurs
      # heures : le job le signale au lieu de s'exécuter.
      - name: Analyse des dépendances
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning title=Dependency-Check::secret NVD_API_KEY absent, analyse non exécutée"
            exit 0
          fi
          ./mvnw -B org.owasp:dependency-check-maven:check

      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check
          path: src/server/target/dependency-check-report.*
          if-no-files-found: ignore

  compose:
    name: Lancement par docker compose et bout en bout
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/docker-hub-mirror

      # Ce que fait le correcteur en suivant le README : le script, puis docker compose. Sur ce runner
      # neuf, sans base NSS de Chromium, le script vérifie aussi qu'il la crée (ADR 0004).
      - name: Certificats et secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y mkcert libnss3-tools
          ./scripts/gen-certs.sh

      - name: Démarrage
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: TLS 1.3 seul (TRN-01), TRACE refusé (A02)
        run: |
          ca="$(mkcert -CAROOT)/rootCA.pem"
          curl --cacert "$ca" --tlsv1.3 -fsS -o /dev/null https://localhost:8443/
          if curl --cacert "$ca" --tls-max 1.2 -sS -o /dev/null https://localhost:8443/; then
            echo "::error::le serveur accepte TLS 1.2"
            exit 1
          fi
          status=$(curl --cacert "$ca" -s -o /dev/null -w '%{http_code}' -X TRACE https://localhost:8443/)
          [ "$status" = 405 ] || { echo "::error::TRACE répond $status"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Tests de bout en bout (Playwright)
        working-directory: src/client
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Archive de remise (OPS-02)
        run: |
          printf '%%PDF-1.4\n' > ../presentation.pdf
          ./scripts/package.sh
          unzip -Z1 ../projet.zip | grep -E '^chat/[^/]+$'

      - name: Journaux
        if: failure()
        run: docker compose logs

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/client/playwright-report
          if-no-files-found: ignore

      - name: Arrêt
        if: always()
        run: docker compose down --volumes
