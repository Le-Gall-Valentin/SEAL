# Configuration commune de SEAL. Les secrets viennent de l'environnement (.env, SEC-22), jamais de ce fichier.
spring:
  application:
    name: seal
  profiles:
    # Sans profil explicite, SEAL démarre en profil demo, celui de la démonstration et de docker compose.
    default: demo
    # TLS (TRN-01) est actif en demo comme en prod ; les tests n'activent que le profil test, sans TLS.
    group:
      demo: tls
      prod: tls
  datasource:
    url: ${SEAL_DB_URL:jdbc:postgresql://localhost:5432/seal}
    username: ${SEAL_DB_USER:seal}
    password: ${SEAL_DB_PASSWORD:}
    hikari:
      data-source-properties:
        # SEC-21 : le pilote PostgreSQL ne recopie pas le détail du serveur (« Key (email)=(…) already exists »)
        # dans ses exceptions, qui finiraient dans les traces avec un courriel en clair.
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      # DATA-01 : Flyway seul fait évoluer le schéma, Hibernate ne fait que le vérifier.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  session:
    # AUTH-52 : 30 minutes d'inactivité, appliquées que le serveur soit embarqué ou non ; la limite de 12 heures est
    # celle d'AbsoluteSessionTimeoutFilter. Le cookie (AUTH-51) est fixé par SessionCookieConfiguration.
    timeout: 30m
    jdbc:
      # Tables créées par Flyway (V1__schema_initial.sql), jamais par Spring Session.
      initialize-schema: never
  jackson:
    deserialization:
      # Section 14 du CDC : aucun champ inconnu accepté dans une requête.
      fail-on-unknown-properties: true

server:
  # TRN-02 : origine unique https://localhost:8443 pour le client, l'API et la WebSocket.
  port: 8443
  error:
    # A02 : aucune trace de pile ni message interne dans les réponses.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

logging:
  pattern:
    # SEC-21 : l'identifiant de corrélation de la requête (CorrelationIdFilter) ouvre chaque ligne.
    correlation: "[%X{correlationId:-}] "

# A02 : Actuator limité à health, sur un port de gestion interne au conteneur, jamais publié.
management:
  server:
    port: 8081
    address: 127.0.0.1
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never

seal:
  origin: https://localhost:8443
  security:
    # TRN-03 : valeur du profil demo, surchargée par application-prod.yaml.
    hsts-max-age: 300s
  session:
    # AUTH-52 : une session expire 12 heures après sa création, même active (AbsoluteSessionTimeoutFilter).
    absolute-timeout: 12h
